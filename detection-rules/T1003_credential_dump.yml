<![CDATA[# ============================================================
# Detection Rule: Credential Dumping — LSASS (T1003.001)
# SIEM Home Lab — MITRE ATT&CK Mapped Detection
# ============================================================

title: LSASS Memory Access Detection (Credential Dumping)
id: DET-004
status: production
description: |
  Detects processes accessing LSASS (Local Security Authority Subsystem Service)
  memory, which is a primary indicator of credential dumping attacks using tools
  like Mimikatz, procdump, or comsvcs.dll MiniDump.

author: SOC Home Lab
date: 2024-10-01
modified: 2024-10-20

mitre_attack:
  technique_id: T1003.001
  technique_name: "OS Credential Dumping: LSASS Memory"
  tactic: Credential Access
  reference: https://attack.mitre.org/techniques/T1003/001/

data_sources:
  - Sysmon Event ID 10 (Process Access)
  - Sysmon Event ID 1 (Process Creation — procdump, rundll32)
  - Sysmon Event ID 11 (File Create — .dmp files)

detection:
  query: |
    index=sysmon EventCode=10 TargetImage="*\\lsass.exe"
    | where NOT match(SourceImage, "(?i)(csrss|wininit|wmiprvse|svchost|MsMpEng|NisSrv|SecurityHealthService|taskhostw)\.exe$")
    | eval granted_access_hex=GrantedAccess
    | eval risk_score=case(
        GrantedAccess="0x1FFFFF", 100,
        GrantedAccess="0x1010", 80,
        GrantedAccess="0x143A", 90,
        1=1, 70)
    | table _time, Computer, SourceImage, SourceUser, TargetImage, GrantedAccess, risk_score

  condition: Non-whitelisted process accessing lsass.exe
  schedule: "*/5 * * * *"

  # High-risk GrantedAccess values:
  # 0x1FFFFF = PROCESS_ALL_ACCESS (full access — highest risk)
  # 0x143A   = PROCESS_VM_READ + PROCESS_QUERY_INFORMATION (Mimikatz default)
  # 0x1010   = PROCESS_VM_READ + PROCESS_QUERY_LIMITED_INFORMATION

false_positives:
  - Windows Defender / Microsoft Defender for Endpoint (MsMpEng.exe)
  - Windows Security Health Service
  - VMware Tools
  - Carbon Black / CrowdStrike sensor processes
  - LSASS self-access during credential validation

tuning_notes:
  - v1.0: Logged all LSASS access — extremely noisy (70% FP from AV)
  - v1.1: Excluded csrss.exe, wininit.exe — reduced to 40%
  - v1.2: Excluded MsMpEng.exe, NisSrv.exe (Defender) — reduced to 15%
  - v1.3: Excluded svchost.exe, taskhostw.exe — reduced to 5%
  - v1.4: Added GrantedAccess-based risk scoring for prioritization

severity: critical
confidence: high
risk_score: 90
]]>
