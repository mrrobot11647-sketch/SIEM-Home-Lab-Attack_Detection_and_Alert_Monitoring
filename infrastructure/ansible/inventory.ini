<![CDATA[# ============================================================
# SIEM Home Lab — Ansible Inventory
# ============================================================

[splunk_server]
splunk ansible_host=10.0.0.100 ansible_user=vagrant ansible_ssh_pass=vagrant

[windows_targets]
win-target ansible_host=10.0.0.20 ansible_user=vagrant ansible_password=vagrant ansible_connection=winrm ansible_winrm_server_cert_validation=ignore ansible_port=5986

[linux_targets]
linux-target ansible_host=10.0.0.30 ansible_user=vagrant ansible_ssh_pass=vagrant

[kali]
kali-attacker ansible_host=10.0.0.10 ansible_user=vagrant ansible_ssh_pass=vagrant

[all:vars]
ansible_python_interpreter=/usr/bin/python3
splunk_server_ip=10.0.0.100
splunk_receiving_port=9997
