<![CDATA[# ============================================================
# Splunk Props Configuration — SIEM Home Lab
# Location: $SPLUNK_HOME/etc/system/local/props.conf
# Field extractions and timestamp parsing
# ============================================================

# ── Sysmon XML Events ──
[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
TIME_PREFIX = SystemTime=\'
MAX_TIMESTAMP_LOOKAHEAD = 64
TruncatedTimestamp = true
TRANSFORMS-sysmon = sysmon_eventcode, sysmon_image, sysmon_commandline, sysmon_parentimage, sysmon_user, sysmon_targetimage, sysmon_destip, sysmon_destport, sysmon_sourceip, sysmon_hash

# ── Windows Security Events ──
[WinEventLog:Security]
SHOULD_LINEMERGE = false
TIME_FORMAT = %m/%d/%Y %I:%M:%S %p
MAX_TIMESTAMP_LOOKAHEAD = 30
TRANSFORMS-security = security_eventcode, security_account, security_srcip, security_logontype

# ── Linux Auth Logs ──
[linux:auth]
SHOULD_LINEMERGE = false
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
TRANSFORMS-auth = linux_auth_user, linux_auth_srcip, linux_auth_action

# ── Linux Audit Logs ──
[linux:audit]
SHOULD_LINEMERGE = false
TIME_FORMAT = %s
TIME_PREFIX = audit\(
MAX_TIMESTAMP_LOOKAHEAD = 20
TRANSFORMS-audit = linux_audit_type, linux_audit_key
]]>
