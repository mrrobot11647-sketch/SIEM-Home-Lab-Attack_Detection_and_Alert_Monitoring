<![CDATA[# ============================================================
# Splunk Transforms Configuration — SIEM Home Lab
# Location: $SPLUNK_HOME/etc/system/local/transforms.conf
# Field extraction definitions referenced by props.conf
# ============================================================

# ═══════════════════════════════════════════════
# Sysmon Field Extractions
# ═══════════════════════════════════════════════

[sysmon_eventcode]
REGEX = <EventID>(\d+)</EventID>
FORMAT = EventCode::$1
DEST_KEY = _meta

[sysmon_image]
REGEX = <Data Name='Image'>([^<]+)</Data>
FORMAT = Image::$1
DEST_KEY = _meta

[sysmon_commandline]
REGEX = <Data Name='CommandLine'>([^<]+)</Data>
FORMAT = CommandLine::$1
DEST_KEY = _meta

[sysmon_parentimage]
REGEX = <Data Name='ParentImage'>([^<]+)</Data>
FORMAT = ParentImage::$1
DEST_KEY = _meta

[sysmon_user]
REGEX = <Data Name='User'>([^<]+)</Data>
FORMAT = User::$1
DEST_KEY = _meta

[sysmon_targetimage]
REGEX = <Data Name='TargetImage'>([^<]+)</Data>
FORMAT = TargetImage::$1
DEST_KEY = _meta

[sysmon_destip]
REGEX = <Data Name='DestinationIp'>([^<]+)</Data>
FORMAT = DestinationIp::$1
DEST_KEY = _meta

[sysmon_destport]
REGEX = <Data Name='DestinationPort'>([^<]+)</Data>
FORMAT = DestinationPort::$1
DEST_KEY = _meta

[sysmon_sourceip]
REGEX = <Data Name='SourceIp'>([^<]+)</Data>
FORMAT = SourceIp::$1
DEST_KEY = _meta

[sysmon_hash]
REGEX = <Data Name='Hashes'>([^<]+)</Data>
FORMAT = Hashes::$1
DEST_KEY = _meta

# ═══════════════════════════════════════════════
# Windows Security Event Extractions
# ═══════════════════════════════════════════════

[security_eventcode]
REGEX = EventCode=(\d+)
FORMAT = EventCode::$1

[security_account]
REGEX = Account Name:\s+(\S+)
FORMAT = Account_Name::$1

[security_srcip]
REGEX = Source Network Address:\s+(\S+)
FORMAT = src_ip::$1

[security_logontype]
REGEX = Logon Type:\s+(\d+)
FORMAT = Logon_Type::$1

# ═══════════════════════════════════════════════
# Linux Auth Log Extractions
# ═══════════════════════════════════════════════

[linux_auth_user]
REGEX = (?:user|for)\s+(\w+)
FORMAT = user::$1

[linux_auth_srcip]
REGEX = from\s+(\d+\.\d+\.\d+\.\d+)
FORMAT = src_ip::$1

[linux_auth_action]
REGEX = (Failed|Accepted|Invalid)\s+password
FORMAT = auth_action::$1

# ═══════════════════════════════════════════════
# Linux Audit Log Extractions
# ═══════════════════════════════════════════════

[linux_audit_type]
REGEX = type=(\w+)
FORMAT = audit_type::$1

[linux_audit_key]
REGEX = key="([^"]+)"
FORMAT = audit_key::$1
]]>
