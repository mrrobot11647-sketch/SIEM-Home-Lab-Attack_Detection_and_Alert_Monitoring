<![CDATA[# ============================================================
# Splunk Saved Searches — Detection Alerts
# SIEM Home Lab — MITRE ATT&CK Mapped Detections
# Location: $SPLUNK_HOME/etc/system/local/savedsearches.conf
# ============================================================

# ═══════════════════════════════════════════════════════════
# DETECTION 1: Brute Force — RDP (T1110.001)
# ═══════════════════════════════════════════════════════════
[ALERT - T1110.001 - RDP Brute Force Detected]
description = Detects multiple failed RDP logon attempts from a single source IP within 5 minutes. Mapped to MITRE T1110.001 (Password Guessing).
search = index=wineventlog EventCode=4625 Logon_Type=10 \
| bin _time span=5m \
| stats count as failed_attempts, values(Account_Name) as targeted_accounts, dc(Account_Name) as unique_accounts by src_ip, _time, ComputerName \
| where failed_attempts > 10 \
| eval severity=case(failed_attempts>50, "Critical", failed_attempts>25, "High", failed_attempts>10, "Medium") \
| eval mitre_technique="T1110.001" \
| eval mitre_tactic="Credential Access" \
| table _time, ComputerName, src_ip, failed_attempts, unique_accounts, targeted_accounts, severity, mitre_technique, mitre_tactic
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = src_ip
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
action.email.to = soc-alerts@lab.local
action.email.subject = [ALERT] RDP Brute Force Detected from $result.src_ip$
enableSched = 1

# ═══════════════════════════════════════════════════════════
# DETECTION 2: Brute Force — SSH (T1110.001)
# ═══════════════════════════════════════════════════════════
[ALERT - T1110.001 - SSH Brute Force Detected]
description = Detects multiple failed SSH authentication attempts from a single source IP. Mapped to MITRE T1110.001 (Password Guessing).
search = index=linux sourcetype=linux:auth "Failed password" \
| rex "Failed password for (?:invalid user )?(?<target_user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<src_port>\d+)" \
| bin _time span=5m \
| stats count as failed_attempts, values(target_user) as targeted_users, dc(target_user) as unique_users by src_ip, _time, host \
| where failed_attempts > 10 \
| eval severity=case(failed_attempts>50, "Critical", failed_attempts>25, "High", failed_attempts>10, "Medium") \
| eval mitre_technique="T1110.001" \
| eval mitre_tactic="Credential Access" \
| table _time, host, src_ip, failed_attempts, unique_users, targeted_users, severity, mitre_technique, mitre_tactic
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = src_ip
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
enableSched = 1

# ═══════════════════════════════════════════════════════════
# DETECTION 3: Suspicious PowerShell Execution (T1059.001)
# ═══════════════════════════════════════════════════════════
[ALERT - T1059.001 - Suspicious PowerShell Execution]
description = Detects PowerShell execution with encoded commands, download cradles, or suspicious parameters. Mapped to MITRE T1059.001 (PowerShell).
search = index=sysmon EventCode=1 Image="*\\powershell.exe" \
  (CommandLine="*-EncodedCommand*" OR CommandLine="*-enc *" OR CommandLine="*-e *" \
   OR CommandLine="*DownloadString*" OR CommandLine="*DownloadFile*" \
   OR CommandLine="*IEX*" OR CommandLine="*Invoke-Expression*" \
   OR CommandLine="*Net.WebClient*" OR CommandLine="*Start-BitsTransfer*" \
   OR CommandLine="*Invoke-WebRequest*" OR CommandLine="*-WindowStyle Hidden*" \
   OR CommandLine="*-w hidden*" OR CommandLine="*FromBase64String*" \
   OR CommandLine="*-nop*" OR CommandLine="*-noni*" \
   OR CommandLine="*Invoke-Mimikatz*" OR CommandLine="*Invoke-Shellcode*") \
| eval risk_score=case( \
    like(CommandLine, "%EncodedCommand%") OR like(CommandLine, "%-enc %"), 80, \
    like(CommandLine, "%DownloadString%") OR like(CommandLine, "%Net.WebClient%"), 90, \
    like(CommandLine, "%Invoke-Mimikatz%") OR like(CommandLine, "%Invoke-Shellcode%"), 100, \
    1=1, 60) \
| eval mitre_technique="T1059.001" \
| eval mitre_tactic="Execution" \
NOT (ParentImage="*\\svchost.exe" User="NT AUTHORITY\\SYSTEM" CommandLine="*WindowsUpdate*") \
NOT (ParentImage="*\\ccmexec.exe") \
| table _time, Computer, User, ParentImage, Image, CommandLine, risk_score, mitre_technique, mitre_tactic \
| sort -risk_score
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 5
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
enableSched = 1

# ═══════════════════════════════════════════════════════════
# DETECTION 4: Credential Dumping — LSASS Access (T1003.001)
# ═══════════════════════════════════════════════════════════
[ALERT - T1003.001 - LSASS Memory Access Detected]
description = Detects processes accessing LSASS memory, indicating potential credential dumping. Mapped to MITRE T1003.001 (LSASS Memory).
search = index=sysmon EventCode=10 TargetImage="*\\lsass.exe" \
| eval granted_access_hex=GrantedAccess \
| where NOT match(SourceImage, "(?i)(csrss|wininit|wmiprvse|svchost|MsMpEng|NisSrv|SecurityHealthService|taskhostw)\.exe$") \
| eval risk_score=case( \
    GrantedAccess="0x1FFFFF", 100, \
    GrantedAccess="0x1010", 80, \
    GrantedAccess="0x143A", 90, \
    1=1, 70) \
| eval mitre_technique="T1003.001" \
| eval mitre_tactic="Credential Access" \
| table _time, Computer, SourceImage, SourceUser, TargetImage, GrantedAccess, risk_score, mitre_technique, mitre_tactic \
| sort -risk_score
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 5
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
enableSched = 1

# ═══════════════════════════════════════════════════════════
# DETECTION 5: Scheduled Task Persistence (T1053.005)
# ═══════════════════════════════════════════════════════════
[ALERT - T1053.005 - Suspicious Scheduled Task Created]
description = Detects scheduled task creation via schtasks.exe from suspicious parent processes. Mapped to MITRE T1053.005 (Scheduled Task).
search = index=sysmon EventCode=1 Image="*\\schtasks.exe" CommandLine="*/create*" \
| where NOT match(ParentImage, "(?i)(services|taskeng|wmiprvse|svchost|mmc)\.exe$") \
| eval risk_score=case( \
    like(CommandLine, "%SYSTEM%"), 90, \
    like(CommandLine, "%onlogon%") OR like(CommandLine, "%onstart%"), 80, \
    like(CommandLine, "%Hidden%") OR like(CommandLine, "%-WindowStyle Hidden%"), 85, \
    1=1, 60) \
| eval mitre_technique="T1053.005" \
| eval mitre_tactic="Persistence" \
| table _time, Computer, User, ParentImage, Image, CommandLine, risk_score, mitre_technique, mitre_tactic \
| sort -risk_score
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 4
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
enableSched = 1

# ═══════════════════════════════════════════════════════════
# DETECTION 6: UAC Bypass — Privilege Escalation (T1548.002)
# ═══════════════════════════════════════════════════════════
[ALERT - T1548.002 - UAC Bypass Attempt Detected]
description = Detects UAC bypass techniques via registry modification of ms-settings or mscfile shell commands. Mapped to MITRE T1548.002 (Bypass User Account Control).
search = index=sysmon EventCode=13 \
  (TargetObject="*\\ms-settings\\Shell\\Open\\command*" \
   OR TargetObject="*\\mscfile\\Shell\\Open\\command*" \
   OR TargetObject="*\\Classes\\exefile\\Shell\\Open\\command*") \
| eval mitre_technique="T1548.002" \
| eval mitre_tactic="Privilege Escalation" \
| eval risk_score=95 \
| table _time, Computer, User, Image, TargetObject, Details, risk_score, mitre_technique, mitre_tactic \
| sort -_time
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 5
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
enableSched = 1

# ═══════════════════════════════════════════════════════════
# DETECTION 7: Successful Login After Brute Force (T1110)
# ═══════════════════════════════════════════════════════════
[ALERT - T1110 - Successful Login Following Failed Attempts]
description = Detects successful authentication following multiple failed attempts from the same source, indicating potential brute force success.
search = index=wineventlog (EventCode=4625 OR EventCode=4624) \
| eval auth_result=case(EventCode=4625, "failure", EventCode=4624, "success") \
| bin _time span=10m \
| stats count(eval(auth_result="failure")) as failures, count(eval(auth_result="success")) as successes, latest(_time) as last_event by src_ip, Account_Name, ComputerName \
| where failures > 5 AND successes > 0 \
| eval severity="Critical" \
| eval mitre_technique="T1110" \
| eval mitre_tactic="Credential Access" \
| eval alert_message="Successful login detected after ".failures." failed attempts from ".src_ip \
| table last_event, ComputerName, src_ip, Account_Name, failures, successes, severity, alert_message, mitre_technique
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
is_scheduled = 1
alert.severity = 5
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
enableSched = 1
]]>
